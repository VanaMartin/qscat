[project]
name = "qscat-run"
version = "0.0.0"
description = "qscat-run — a config-driven CLI for 2-D electron-diatomic model experiments"
requires-python = ">=3.12"
dependencies = [
    "qscat",
    "click>=8",
    "pyyaml>=6.0.1",
    "matplotlib>=3",
    "numpy>=2",
]

[project.scripts]
qscat-run = "qscat_run.cli:main"

[tool.uv.sources]
qscat = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qscat_run"]
