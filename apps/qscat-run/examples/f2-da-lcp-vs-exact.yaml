# qscat-run example: F2 dissociative attachment (DA) computed BOTH exactly
# (the 2-D `ti` driven solve) and via the `lcp` local-complex-potential
# approximation, in ONE run. Their cross sections land under disjoint keys
# (`ti:da:ch0` vs `lcp:da:ch0`), so `cross_section.png` overlays the
# approximation against the exact oracle it is meant to reproduce -- the
# sub-project-B deliverable (see docs/physics/diatomic-ve-cross-sections.md and
# docs/physics/figures/f2-2d-da-lcp-vs-exact.png).
#
# The `lcp` method has no explicit-grid form: it needs the preset's paired
# two-ECS-angle electronic decks + the fine nuclear deck, so it always runs on
# `grid: {preset: emoscat}` (the production F2 deck -- run via Docker/MUMPS for
# the full energy sweep; a couple of energies is a laptop-feasible smoke).
#
# Run:
#   qscat-run validate apps/qscat-run/examples/f2-da-lcp-vs-exact.yaml
#   qscat-run run apps/qscat-run/examples/f2-da-lcp-vs-exact.yaml --output runs/f2-da-lcp

molecule: F2
methods: [ti, lcp]

observables:
  - {kind: da, channels: 1}   # 1 dissociation channel

v_init: 0
energies: {values: [0.02, 0.03, 0.04]}

grid: {preset: emoscat}

artifacts:
  cross_section: true
  eigenstates: true            # also emit F2's vibrational levels + eigenstates

backend: auto
output_dir: runs/f2-da-lcp
