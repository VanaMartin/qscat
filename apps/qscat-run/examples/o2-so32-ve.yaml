# qscat-run example: O2 vibrational-excitation (VE), time-independent (TI),
# on the potential factory's FITTED O2 model -- the 2Pi_{3/2} spin-orbit component (`qscat.model.O2_SO32`); Alt &
# Houfek, PRA 103, 032829 (2021), Fig. 2 reproduced to its extraction floor;
# docs/physics/potential-factory.md.
#
# GENERATED by `python -m validation.factory.o2_ve_energies` -- edit that,
# not this. O2's VE cross section is a comb of NARROW peaks at the anion's
# quasi-bound levels (widths 0.01-8 meV), so the energies are a level-aware
# mesh: a 0 mHa background grid plus 121 points across
# +-6 widths of every level in the window, from the model's own
# levels (`validation/factory/results/o2-so32-anion-levels.csv`);
# 27 ranges expanding to 3343 energies.
# Elastic + 0->1..5, the six panels of the paper's Fig. 5.
#
# The `tuner` preset is the discretisation tuner's deck, nuclear grid refined
# once by the 2-D spot check (178k unknowns): minutes per energy with SuperLU
# on a laptop, seconds with MUMPS -- run it in the Docker `test-deps` image on
# a machine with room.
#
# Run:
#   qscat-run validate apps/qscat-run/examples/o2-so32-ve.yaml
#   qscat-run run apps/qscat-run/examples/o2-so32-ve.yaml --output runs/o2-so32-ve

molecule: O2_SO32
methods: [ti]

observables:
  - {kind: ve, channels: 6}

energies:
  # One `np.arange(start, stop, step)` per line; the mesh is their union. The
  # first is the background sweep, the rest one window per level.
  ranges:
    - {start: 0.002, stop: 0.10025, step: 0.0005}
    - {start: 0.002903563945098501, stop: 0.003036412744763494, step: 1.1024796652696496e-06}
