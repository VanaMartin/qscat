# F2 vibrational excitation, exact 2-D TI, DENSE. Replaces a 25-point curve at
# 0.004 Ha step -- about one sample per ~0.004 Ha boomerang feature.
molecule: F2
methods: [ti]
observables:
  - {kind: ve, channels: [0, 1, 2]}
v_init: 0
energies:
  # one uniform sweep: np.arange(start, stop, step), stop exclusive --
  # padded by half a step so 0.1 is included
  ranges: [{start: 0.004, stop: 0.1005, step: 0.001}]
grid: {preset: emoscat}
artifacts: {cross_section: true}
backend: auto
output_dir: runs/f2-ve-dense
