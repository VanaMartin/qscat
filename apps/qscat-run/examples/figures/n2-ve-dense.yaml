# N2 vibrational excitation, exact 2-D TI, DENSE, with Houfek's independent
# published data overlaid via the `reference:` block. Replaces a 60-point curve
# (step 0.0033 Ha) against a reference sampled at 400 points.
molecule: N2
methods: [ti]
observables:
  - {kind: ve, channels: [0, 1, 2]}
v_init: 0
energies:
  # one uniform sweep: np.arange(start, stop, step), stop exclusive --
  # padded by half a step so 0.2 is included
  ranges: [{start: 0.005, stop: 0.2005, step: 0.001}]
grid: {preset: emoscat}
reference:
  - path: ../../../../validation/n2/data/CSVE.V00.J00
    format: houfek
    label: "Houfek (2006) CSVE.V00.J00"
    channels: [0, 1, 2]
artifacts: {cross_section: true}
backend: auto
output_dir: runs/n2-ve-dense
