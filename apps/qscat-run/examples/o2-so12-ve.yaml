# qscat-run example: O2 vibrational-excitation (VE), time-independent (TI),
# on the potential factory's FITTED O2 model -- the 2Pi_{1/2} spin-orbit component (`qscat.model.O2_SO12`); Alt &
# Houfek, PRA 103, 032829 (2021), Fig. 2 reproduced to its extraction floor;
# docs/physics/potential-factory.md.
#
# GENERATED by `python -m validation.factory.o2_ve_energies` -- edit that,
# not this. O2's VE cross section is a comb of NARROW peaks at the anion's
# quasi-bound levels (widths 0.01-8 meV), so the energies are a level-aware
# mesh: a 1 mHa background grid plus 41 points across
# +-5 widths of every level in the window, from the model's own
# levels (`validation/factory/results/o2-so12-anion-levels.csv`); 1165 energies.
# Elastic + 0->1..4, the paper's Figs. 5-6.
#
# The `tuner` preset is the discretisation tuner's deck, nuclear grid refined
# once by the 2-D spot check (178k unknowns): minutes per energy with SuperLU
# on a laptop, seconds with MUMPS -- run it in the Docker `test-deps` image on
# a machine with room.
#
# Run:
#   qscat-run validate apps/qscat-run/examples/o2-so12-ve.yaml
#   qscat-run run apps/qscat-run/examples/o2-so12-ve.yaml --output runs/o2-so12-ve

