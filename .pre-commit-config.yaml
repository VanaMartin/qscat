repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this in step with the `ruff>=` floor in pyproject.toml's dev group:
    # ruff's FORMATTER output changes between releases, so a hook pinned to an
    # older ruff than the one developers run will fight it file by file.
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'for manifest in native/*/Cargo.toml; do cargo fmt --manifest-path "$manifest" --check || exit; done'
        language: system
        files: \.rs$
        pass_filenames: false
