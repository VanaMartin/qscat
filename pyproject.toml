[project]
name = "qmodeling"
version = "0.0.0"
description = "Quantum-mechanics research monorepo (QSCAT)"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "native/*"]

[tool.pytest.ini_options]
# reference/ holds read-only prior codebases (eMoScat, libXcuda), not part of
# this workspace's test suite — their *_test.py files assume a different cwd
# and fixture layout. Never collect them.
norecursedirs = [".venv", ".git", "reference", "target", "*.egg-info"]
pythonpath = ["."]
markers = [
    "slow: heavier checks (production-scale assembly); deselect with -m 'not slow'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-benchmark>=4",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "maturin>=1.7",
    "numpy>=2",
    "scipy>=1.14",
    "mpmath>=1.3",
    "matplotlib>=3.9",
    "hatchling>=1.6",
    "scipy-stubs>=1.18.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# reference/ is a read-only snapshot of prior codebases (eMoScat, libXcuda) that
# we must never edit — linting it produces ~124 unfixable diagnostics and makes
# `ruff check .` permanently red. pytest already skips it via norecursedirs.
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.ruff.lint.per-file-ignores]
# `l` is the standard physics symbol for the orbital angular momentum quantum
# number, and these lines transcribe formulas that use it (l(l+1)/2r²).
# Renaming it to satisfy E741 would obscure the physics being transcribed.
"validation/n2/model.py" = ["E741"]
"validation/n2/test_model.py" = ["E741"]
"libs/qscat/qscat/special/radial.py" = ["E741"]
"libs/qscat/tests/test_special_radial.py" = ["E741"]
"libs/qscat/tests/test_radial_mass.py" = ["E741"]
"projects/n2_2d_cross_section/channels.py" = ["E741"]
"projects/n2_2d_cross_section/cross_section_2d.py" = ["E741"]
"projects/n2_2d_cross_section/test_cross_section_2d.py" = ["E741"]
"libs/qscat/qscat/core/channels.py" = ["E741"]
"libs/qscat/qscat/core/driven.py" = ["E741"]
"libs/qscat/qscat/core/correlation.py" = ["E741"]
"libs/qscat/tests/test_core_driven.py" = ["E741"]
"projects/n2_2d_td_cross_section/correlation.py" = ["E741"]
"projects/n2_2d_td_cross_section/convergence.py" = ["E741"]
"libs/qscat/qscat/special/coulomb.py" = ["E741"]
"libs/qscat/tests/test_coulomb.py" = ["E741"]
"libs/qscat/qscat/tuning/probes.py" = ["E741"]
# Lambda-assigned potential callables transcribe the brief's test cases
# verbatim (V = lambda x: ...); rewriting them as def would deviate from the
# spec without changing behavior.
"libs/qscat/tests/test_tuning_analyze.py" = ["E731"]
# Same rationale, plus the brief's one-liner test bodies (semicolon-joined
# statements, one slightly-long inline comment) transcribed verbatim.
"libs/qscat/tests/test_tuning_mesh.py" = ["E731", "E702", "E501"]
# Same rationale (V = lambda z: ... transcribed verbatim from the brief);
# E501 covers one review-added line transcribed verbatim from the coordinator.
"libs/qscat/tests/test_tuning_ecs.py" = ["E731", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
