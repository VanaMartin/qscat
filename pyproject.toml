[project]
name = "qmodeling"
version = "0.0.0"
description = "Quantum-mechanics research monorepo (QSCAT)"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "native/*"]

[tool.pytest.ini_options]
# reference/ holds read-only prior codebases (eMoScat, libXcuda), not part of
# this workspace's test suite — their *_test.py files assume a different cwd
# and fixture layout. Never collect them.
norecursedirs = [".venv", ".git", "reference", "target", "*.egg-info"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-benchmark>=4",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "maturin>=1.7",
    "numpy>=2",
    "scipy>=1.14",
    "mpmath>=1.3",
    "matplotlib>=3.9",
    "hatchling>=1.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
