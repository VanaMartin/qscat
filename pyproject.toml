[project]
name = "qmodeling"
version = "0.0.0"
description = "Quantum-mechanics research monorepo (QSCAT)"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "native/*", "apps/*"]

[tool.pytest.ini_options]
# reference/ holds read-only prior codebases (eMoScat, libXcuda), not part of
# this workspace's test suite — their *_test.py files assume a different cwd
# and fixture layout. Never collect them.
# .claude/ can contain embedded git worktrees under .claude/worktrees/ (e.g.
# live work checked out on another branch); their test modules share
# basenames with the real tree and break collection with duplicate-module
# errors. Never recurse into .claude/.
norecursedirs = [".venv", ".git", ".hypothesis", "reference", "target", "*.egg-info", ".claude"]
pythonpath = ["."]
# The two tiers (docs/adr/0005-test-tiers-fast-and-slow.md):
#
#   default -- toy-scale. Every test proves a piece of library behaviour on the
#              smallest deck that can still fail for the right reason. This tier
#              is the CI gate and must stay quick enough to run on every push.
#   slow    -- production-scale physics: real molecule decks, converged grids,
#              multi-thousand-step propagations, published-value comparisons.
#              Run locally (`-m slow`), by the Docker `test` image, and on
#              demand in CI -- .github/workflows/validation.yml runs this tier
#              when a PR carries a `validate:*` label. Never on every push.
#
# The boundary is cost, not importance: a `slow` test is often the more
# valuable one. If a test needs more than a few seconds or more than ~0.5 GB,
# it belongs in `slow` -- or it wants a smaller deck.
markers = [
    "slow: production-scale physics; local + Docker + on-demand CI (validate:* labels). -m 'not slow' deselects",
]

[dependency-groups]
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024.8",
    # Copy button on code blocks; card/dropdown/tab directives for the
    # site-first molecule guides; OpenGraph tags so shared links preview.
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7",
    "sphinxext-opengraph>=0.13",
]
dev = [
    "pytest>=8",
    # Parallel test execution: `uv run pytest -n auto --dist loadfile`. The
    # suite is CPU-bound and process-isolated, so it scales well; note the
    # numerics here are BLAS-threaded, so `-n` above the physical core count
    # can slow things down rather than speed them up.
    #
    # Use `--dist loadfile`, not the default `--dist load`. Memory, not CPU, is
    # the binding constraint: several test modules build their grid at module
    # scope, and per-test distribution makes every worker that touches the
    # module build its own copy. Keeping a file on one worker bounds that to
    # one copy per file. ALWAYS pair a parallel run with `-m "not slow"` --
    # the slow tier includes decks measured at ~19 GB peak RSS on their own.
    "pytest-xdist>=3",
    # Coverage on the fast tier (CI reports it in the step summary).
    # Report-only for now -- no fail-under until a baseline month of numbers
    # exists (decision 2026-08-25, revisit ~2026-09-25).
    "pytest-cov>=6",
    "hypothesis>=6",
    # Keep in step with the ruff-pre-commit `rev:` in .pre-commit-config.yaml --
    # the formatter's output changes between releases, so a mismatch makes
    # `ruff format` and the pre-commit hook disagree.
    "ruff>=0.15.21",
    "mypy>=1.11",
    "maturin>=1.7",
    "numpy>=2",
    "scipy>=1.14",
    "mpmath>=1.3",
    "matplotlib>=3.9",
    "hatchling>=1.6",
    "scipy-stubs>=1.18.0.1",
    "types-PyYAML>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# reference/ is a read-only snapshot of prior codebases (eMoScat, libXcuda) that
# we must never edit — linting it produces ~124 unfixable diagnostics and makes
# `ruff check .` permanently red. pytest already skips it via norecursedirs.
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "RUF", "D", "ANN"]
# RUF001-003 (ambiguous unicode) are off: the docstrings and comments here
# deliberately use unicode maths characters (sigma, multiplication sign, en
# dash) that these rules would flag as confusable with ASCII.
# D205/D209/D400/D401/D403 are off: the library's house style opens with
# multi-sentence summary paragraphs (measured 198 hits, all deliberate
# prose); D here enforces docstring PRESENCE, not summary-line shape.
# ANN401 is off: the 17 remaining `Any` uses are all in qscat.viz's
# lazily-imported-matplotlib boundary (animate.py/artist.py/plot.py), where
# the concrete type is only importable behind a runtime check; mypy --strict
# polices annotations everywhere else.
ignore = ["RUF001", "RUF002", "RUF003", "D205", "D209", "D400", "D401", "D403", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# `l` is the standard physics symbol for the orbital angular momentum quantum
# number, and these lines transcribe formulas that use it (l(l+1)/2r²).
# Renaming it to satisfy E741 would obscure the physics being transcribed.
"validation/n2/model.py" = ["E741"]
"validation/n2/test_model.py" = ["E741"]
"libs/qscat/qscat/special/radial.py" = ["E741"]
"libs/qscat/tests/test_special_radial.py" = ["E741"]
"libs/qscat/tests/test_radial_mass.py" = ["E741"]
"libs/qscat/tests/test_radial_hankel_mass.py" = ["E741"]
"projects/n2_2d_cross_section/channels.py" = ["E741"]
"projects/n2_2d_cross_section/cross_section_2d.py" = ["E741"]
"projects/n2_2d_cross_section/test_cross_section_2d.py" = ["E741"]
"libs/qscat/qscat/core/channels.py" = ["E741"]
"libs/qscat/qscat/core/driven.py" = ["E741"]
"libs/qscat/qscat/core/correlation.py" = ["E741"]
"libs/qscat/tests/test_core_driven.py" = ["E741"]
"projects/n2_2d_td_cross_section/correlation.py" = ["E741"]
"projects/n2_2d_td_cross_section/convergence.py" = ["E741"]
"libs/qscat/qscat/special/coulomb.py" = ["E741"]
"libs/qscat/tests/test_coulomb.py" = ["E741"]
"libs/qscat/qscat/tuning/probes.py" = ["E741"]
# Lambda-assigned potential callables transcribe the brief's test cases
# verbatim (V = lambda x: ...); rewriting them as def would deviate from the
# spec without changing behavior.
"libs/qscat/tests/test_tuning_analyze.py" = ["E731"]
# Same rationale, plus the brief's one-liner test bodies (semicolon-joined
# statements, one slightly-long inline comment) transcribed verbatim.
"libs/qscat/tests/test_tuning_mesh.py" = ["E731", "E702", "E501"]
# Same rationale (V = lambda z: ... transcribed verbatim from the brief);
# E501 covers one review-added line transcribed verbatim from the coordinator.
"libs/qscat/tests/test_tuning_ecs.py" = ["E731", "E501"]
# Same rationale (s = lambda R: ... transcribed verbatim from the brief).
"libs/qscat/tests/test_tuning_resonance.py" = ["E731"]
# `l` is the standard physics symbol for the orbital angular momentum quantum
# number (see libs/qscat/qscat/core/correlation.py's own E741 ignore above).
"libs/qscat/tests/test_correlation.py" = ["E741"]
# Same rationale -- transcribes the radial functions' `l` parameter verbatim.
"libs/qscat/tests/test_kernel_consolidation_oracle.py" = ["E741"]
# Docstring presence (D) is a shipped-library contract; tests, research
# projects, validation harnesses and app internals are exempt. ANN beyond
# the annotations mypy --strict already enforces is likewise lib-only.
"!libs/qscat/qscat/**" = ["D", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
