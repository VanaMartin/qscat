name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (for the native qscat_kernels member)
        uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type-check (mypy, qscat library)
        run: uv run mypy libs/qscat/qscat

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (for the native qscat_kernels member)
        uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      # `-m "not slow"` is the tier boundary: production-scale physics runs
      # locally and in the Docker `test` image, never here (docs/adr/0005).
      #
      # `--dist loadfile`, NOT the default `--dist load`: several test modules
      # build a multi-GB grid at module scope, and per-test distribution makes
      # every worker that touches the module build its own copy. Keeping a file
      # on one worker bounds that to one copy per file.
      - name: Test (fast suite; MUMPS tests skip without a system MUMPS)
        run: uv run --no-sync pytest -q -m "not slow" -n auto --dist loadfile

  build:
    name: build + clean-venv import + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel (qscat)
        run: uv build --package qscat --out-dir dist
      - name: Import in a CLEAN venv WITHOUT extras (guards the matplotlib break)
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import qscat; import qscat.core; import qscat.tuning; print('qscat', qscat.__version__, 'imports clean (no extras)')"
      - name: twine check
        run: uvx twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qscat-dist
          path: dist/*
