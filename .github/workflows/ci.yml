name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On push events (main) the filter diffs against the previous push
          # to this base; on PRs, against the PR base.
          base: ${{ github.ref_name }}
          filters: |
            native:
              - 'native/**'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  lint:
    name: lint + type-check
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (only when native/** changed — docs/adr/0006)
        if: needs.changes.outputs.native == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync workspace (kernel build skipped unless native/** changed — docs/adr/0006)
        run: uv sync --all-packages ${{ needs.changes.outputs.native != 'true' && '--no-install-package qscat-kernels' || '' }}
      - name: Lint (ruff)
        run: uv run ruff check .
      # The pre-commit hook formats with the same ruff pinned in the `dev`
      # group, so this only fires on a commit that bypassed the hook.
      - name: Format check (ruff)
        run: uv run ruff format --check .
      # Both are strict-clean; `libs/qscat` alone would leave the CLI that
      # drives every observable unchecked.
      - name: Type-check (mypy, qscat library + qscat-run)
        run: uv run mypy libs/qscat/qscat apps/qscat-run/qscat_run
      - name: CITATION.cff version matches qscat.__version__
        run: |
          uv run --no-sync python -c "import sys, yaml, qscat; v = yaml.safe_load(open('CITATION.cff'))['version']; sys.exit(0 if v == qscat.__version__ else f'CITATION.cff version {v!r} != qscat.__version__ {qscat.__version__!r} -- update CITATION.cff (both top-level version: and preferred-citation.version)')"

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Coverage is collected on one cell only: it costs measurable
          # overhead and the number is the same on every row.
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: "--cov=qscat --cov-report=term"
          # One macOS row: catches Accelerate-vs-OpenBLAS numeric divergence
          # and BSD-vs-GNU path assumptions. The BLAS pins below are a
          # measured no-op here (Accelerate; see the env comment) and are
          # kept for uniformity.
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (only when native/** changed — docs/adr/0006)
        if: needs.changes.outputs.native == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync workspace (kernel build skipped unless native/** changed — docs/adr/0006)
        run: uv sync --all-packages ${{ needs.changes.outputs.native != 'true' && '--no-install-package qscat-kernels' || '' }}
      # `-m "not slow"` is the tier boundary: production-scale physics runs
      # locally and in the Docker `test` image, never here (docs/adr/0005).
      #
      # `--dist loadfile`, NOT the default `--dist load`: several test modules
      # build a multi-GB grid at module scope, and per-test distribution makes
      # every worker that touches the module build its own copy. Keeping a file
      # on one worker bounds that to one copy per file.
      - name: Test (fast suite; MUMPS tests skip without a system MUMPS)
        # One BLAS thread per worker. The runner has 4 vCPU, `-n auto` starts 4
        # workers, and OpenBLAS defaults to one thread per core in EACH of them
        # -- 16 threads contending for 4 cores. Measured: without this, the step
        # ran past 22 min (SLOWER than the 24.7 min it took serially before any
        # of this work) while the identical command takes 123 s locally at
        # `-n 4`. It does not reproduce on macOS because scipy there links
        # Accelerate, which does not oversubscribe the same way -- pinning
        # changed nothing locally (76.1 s pinned vs 74.6 s unpinned at a saturating `-n 12`).
        # The pins stay on the macOS row too: they are a measured no-op there
        # (Accelerate), kept so the workflow has no per-OS env conditional --
        # and they become load-bearing again if a future macOS scipy wheel
        # ever links OpenBLAS instead.
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: uv run --no-sync pytest -q -m "not slow" -n auto --dist loadfile ${{ matrix.coverage }}
      - name: Coverage summary
        if: matrix.coverage != ''
        run: |
          {
            echo "### Coverage — qscat, fast tier (report-only; no fail-under until a baseline exists)"
            echo
            uv run --no-sync python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  min-versions:
    name: test (lowest direct deps)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (only when native/** changed — docs/adr/0006)
        if: needs.changes.outputs.native == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      # Floors under test (from the pyprojects): numpy 2.0.0, scipy 1.14.0,
      # mpmath 1.3.0, matplotlib 3.9.0 (plot extra) / 3.0 (qscat-run --
      # resolver reconciles upward), click 8.0, pyyaml 6.0.1 (6.0's sdist
      # build breaks under current setuptools -- AttributeError: 'build_ext'
      # object has no attribute 'cython_sources'; raised, not worked around,
      # per the rule below), pytest 8.0, pytest-xdist 3.0, hypothesis 6.20
      # (6.0-6.10 call the pre-3.10 `importlib.metadata.entry_points().get()`
      # dict API unconditionally, which Python 3.12's `EntryPoints` no longer
      # has -- raised past the fix, with a small margin, for the same reason
      # as pyyaml above). If this job fails while the normal rows pass,
      # either fix the code or RAISE the floor -- never let the floor claim a
      # version the suite cannot run on.
      - name: Sync at the declared floors
        run: uv sync --all-packages --resolution lowest-direct ${{ needs.changes.outputs.native != 'true' && '--no-install-package qscat-kernels' || '' }}
      - name: Test (fast suite at the floors)
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: uv run --no-sync pytest -q -m "not slow" -n auto --dist loadfile

  build:
    name: build + clean-venv import + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build sdist + wheel (qscat)
        run: uv build --package qscat --out-dir dist
      - name: Import in a CLEAN venv WITHOUT extras (guards the matplotlib break)
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import qscat; import qscat.core; import qscat.tuning; print('qscat', qscat.__version__, 'imports clean (no extras)')"
      - name: twine check
        run: uvx twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qscat-dist
          path: dist/*
