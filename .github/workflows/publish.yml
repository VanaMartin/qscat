name: Publish qscat to PyPI

# Tag-triggered release of the pure-Python `qscat` wheel + sdist via PyPI
# Trusted Publishing (OIDC — no API tokens). Tag format: qscat-v0.1.0
#
# ONE-TIME SETUP (pending): on PyPI, add a Trusted Publisher for project
# `qscat` pointing at this repo + workflow `publish.yml` + environment `pypi`.
# Until that is configured on PyPI, this workflow will fail at the publish step
# by design (build + twine check still run).

on:
  push:
    tags: ["qscat-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel (qscat)
        run: uv build --package qscat --out-dir dist
      - name: twine check
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: qscat-dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: qscat-dist
          path: dist
      - name: Publish to PyPI
        # Pinned to a release TAG, not the mutable `release/v1` branch: this
        # job holds `id-token: write`, so whatever this action resolves to can
        # mint a PyPI OIDC token. v1.14.2 was the latest release on 2026-08-25;
        # bump it deliberately.
        uses: pypa/gh-action-pypi-publish@v1.14.2
