name: Docs

on:
  push:
    branches: [main]
  pull_request:

# Allow the main-branch build to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # qscat must be importable for autodoc; --group docs adds Sphinx.
      - run: uv sync --package qscat --group docs
      # -W: warnings are errors (the tree is warning-clean). doctest runs the
      # runnable Examples so the docs can't drift from the API.
      - run: uv run sphinx-build -b html -W --keep-going docs docs/_build/html
      - run: uv run sphinx-build -b doctest docs docs/_build/doctest
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
