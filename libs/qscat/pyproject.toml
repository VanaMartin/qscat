[project]
name = "qscat"
version = "0.0.0"
description = "QSCAT standard library — validated quantum-scattering numerics"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qscat"]
